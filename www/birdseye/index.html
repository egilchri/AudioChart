<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ted's Birdseye · AudioChart</title>
<!-- Ted's Birdseye has an address of its own since v1070: egilchri.github.io/birdseye/ (design/birdseye/site/).
     This old address goes there, with anything after the ? passed along; on a test server, to bay3d.html?app=birdseye. -->
<script>
  const q = new URLSearchParams(location.search);
  if (location.hostname === 'egilchri.github.io') location.replace('/birdseye/' + (q.toString() ? '?' + q : ''));
  else { q.set('app', 'birdseye'); location.replace('../bay3d.html?' + q); }
</script>
</head>
<body style="background:#1e3a50;color:#eee;font-family:system-ui,sans-serif">
<p><a href="https://egilchri.github.io/birdseye/" style="color:#e0a843">Ted's Birdseye, from AudioChart</a></p>
</body>
