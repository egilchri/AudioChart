<!doctype html>
<html><head><meta charset="utf-8"><title>MBTA look</title>
<style>html,body{margin:0;background:#9dc4e8}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/www/js/lib/three/three.module.min.js" } }</script>
</head><body>
<script type="module">
// The MBTA's trains alone, from fixed angles (?rail=Commuter Rail|Red Line|...&view=side|full|photo|head|aerial|car&lead=loco|cab),
// as the photos in ref/ were taken (v1140)
import * as THREE from 'three';
const { makeMbtaCR, makeTTrain } = await import('/www/js/mbta3d.js?' + Date.now());
const P = new URLSearchParams(location.search), rail = P.get('rail') || 'Commuter Rail', view = P.get('view') || 'photo';
const W = 1600, H = view === 'side' || view === 'full' ? 560 : 1000;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.setClearColor(0x9dc4e8); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.55;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xe4ecf2, 0x4a5644, 1.7));
const sun = new THREE.DirectionalLight(0xfff3e0, 2.1); sun.position.set(-40, 80, -30); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshLambertMaterial({ color: 0x8a8378 })); ground.rotation.x = -Math.PI / 2; scene.add(ground);
for (const x of [-0.72, 0.72]) { const rl = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.15, 400), new THREE.MeshLambertMaterial({ color: 0x5a5550 })); rl.position.set(x, 0.07, 0); scene.add(rl); }
const t = rail === 'Commuter Rail' ? makeMbtaCR({ cars: +(P.get('cars') || 3), locoFront: P.get('lead') !== 'cab' }) : makeTTrain(rail, P.get('cars') ? { cars: +P.get('cars') } : {});
scene.add(t.group);
const L = t.length, f = -L / 2; let cam;
if (view === 'side' || view === 'full') {
  const span = view === 'side' ? 50 : L + 6, h = span * H / W, x0 = view === 'side' ? f - 1 + span / 2 : 0;
  cam = new THREE.OrthographicCamera(-span / 2, span / 2, h / 2, -h / 2, 1, 200); cam.position.set(-60, 2.6, x0); cam.lookAt(0, 2.6, x0);
} else {
  cam = new THREE.PerspectiveCamera(40, W / H, 0.5, 3000);
  if (view === 'photo') { cam.position.set(-9, 2.4, f - 14); cam.lookAt(0, 2.4, f + 10); }   // (as 2034 leaving North Station)
  if (view === 'head') { cam.position.set(-1.6, 2.0, f - 8); cam.lookAt(0, 2.4, f); }
  if (view === 'aerial') { cam.position.set(-70, 110, f - 40); cam.lookAt(0, 0, f + 60); }
  if (view === 'car') { cam.position.set(-9, 1.6, f + 30); cam.lookAt(0, 2.6, f + 30); }   // (as 749 and 854 at Walpole)
}
r.render(scene, cam); window.__done = true;
</script></body></html>
