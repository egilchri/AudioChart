<!doctype html><meta charset="utf-8"><title>People look</title>
<style>html,body{margin:0;background:#d8d6d0;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "../../../www/js/lib/three/three.module.min.js" } }</script>
<script type="module">
// The platforms' people (www/js/platform3d.js personParts), lined up for a look: ?seed=1&n=12&cam=x,y,z&look=x,y,z
// Lit as in a station in the open (Lambert); &under=1 shades them as the stations underground do (baked, unlit).
import * as THREE from 'three';
import { personParts } from '../../../www/js/platform3d.js';
const q = new URLSearchParams(location.search), n = +(q.get('n') || 12), under = q.has('under');
let seed = +(q.get('seed') || 1); const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xd8d6d0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8478, 1.6)); const sun = new THREE.DirectionalLight(0xffffff, 1.8); sun.position.set(3, 6, 5); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), new THREE.MeshLambertMaterial({ color: 0xa8a59e })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const _c = new THREE.Color();
for (let i = 0; i < n; i++) {
  const x = (i - (n - 1) / 2) * 0.85, z = (i % 2) * 0.25;
  for (const [g, hex] of personParts(rnd)) {
    g.translate(x, 0, z);
    let m;
    if (under) {   // as platform3d's put(): light from above and a side, baked
      const nn = g.attributes.normal, col = [];
      for (let k = 0; k < nn.count; k++) { const f = 0.62 + 0.3 * Math.max(0, nn.getY(k)) + 0.16 * Math.max(0, 0.5 * nn.getX(k) + 0.7 * nn.getZ(k)) - 0.12 * Math.max(0, -nn.getY(k)); _c.set(hex).multiplyScalar(f); col.push(_c.r, _c.g, _c.b); }
      g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); m = new THREE.MeshBasicMaterial({ vertexColors: true });
    } else m = new THREE.MeshLambertMaterial({ color: hex });
    scene.add(new THREE.Mesh(g, m));
  }
}
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 100);
const [cx, cy, cz] = (q.get('cam') || '0,1.25,6.2').split(',').map(Number), [lx, ly, lz] = (q.get('look') || '0,0.95,0').split(',').map(Number);
cam.position.set(cx, cy, cz); cam.lookAt(lx, ly, lz); r.render(scene, cam); window.done = true;
</script>
