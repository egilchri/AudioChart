<!doctype html>
<html><head><meta charset="utf-8"><title>Boston ferry look</title>
<style>html,body{margin:0;background:#9dc4e8}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/www/js/lib/three/three.module.min.js" } }</script>
</head><body>
<script type="module">
// A Boston harbor boat alone (?name=GLORY&L=..&B=..), from her starboard quarter as the photo of Glory (ref/glory.jpg), v1141
import * as THREE from 'three';
const { harborKind } = await import('/www/js/harborferries3d.js?' + Date.now());
const P = new URLSearchParams(location.search);
const W = 1600, H = 1000, r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.setClearColor(0x9dc4e8); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.55;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.add(new THREE.HemisphereLight(0xe4ecf2, 0x4a5644, 1.7));
const sun = new THREE.DirectionalLight(0xfff3e0, 2.1); sun.position.set(-40, 80, -30); scene.add(sun);
const sea = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshLambertMaterial({ color: 0x2c4a68 })); sea.rotation.x = -Math.PI / 2; scene.add(sea);
const k = harborKind({ name: P.get('name') || 'GLORY', lat: 42.3, lon: -70.95, type: 60, L: +(P.get('L') || 0) || undefined, B: +(P.get('B') || 0) || undefined });
const g = k.build([]); scene.add(g); g.rotation.y = Math.PI / 2;   // her bow to the right
const cam = new THREE.PerspectiveCamera(30, W / H, 0.5, 3000); cam.position.set(-18, 6, 70); cam.lookAt(0, 3, 0);
r.render(scene, cam); document.title = k.what; window.__done = true;
</script></body></html>
