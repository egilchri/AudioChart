<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}</style>
<script type="importmap">{ "imports": { "three": "../../../www/js/lib/three/three.module.min.js" } }</script></head><body>
<script type="module">
// (v1200) the sidewalk's furniture, close: a subway stair and elevator, a bus shelter, a newsstand, a meter, a basket,
// a hydrant, a light. +x is the roadway's side. ?v=subway|shelter|all
import * as THREE from 'three';
import { furnitureMesh } from '../../../www/js/streets3d.js';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(1280, 800); r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color(0xa9bfd2);
sc.add(new THREE.HemisphereLight(0xdfe8f0, 0x5a6066, 1.6)); const sun = new THREE.DirectionalLight(0xfff4e0, 2.2); sun.position.set(30, 50, -20); sc.add(sun);
const walk = new THREE.Mesh(new THREE.PlaneGeometry(6, 60), new THREE.MeshLambertMaterial({ color: 0xb4b1aa })); walk.rotation.x = -Math.PI / 2; walk.position.set(-1, 0, 0); sc.add(walk);
const road = new THREE.Mesh(new THREE.PlaneGeometry(14, 60), new THREE.MeshLambertMaterial({ color: 0x4a4c4f })); road.rotation.x = -Math.PI / 2; road.position.set(9, -0.15, 0); sc.add(road);
const v = new URLSearchParams(location.search).get('v') || 'subway';
const put = (name, z, x = 0, color) => { const m = furnitureMesh(name, color); m.position.set(x, 0, z); sc.add(m); return m; };
put('stair', -6, -0.4); put('globe', -6, -0.4, 0x40ff60); put('elevator', 2, -0.6); put('elGlass', 2, -0.6);
put('shelter', 9, -0.5); put('glass', 9, -0.5); put('newsstand', 16, -1); put('meter', -11, 1.5); put('bin', -13, 1.3); put('hydrant', -15, 1.4); put('light', -18, 1.5);
const cam = new THREE.PerspectiveCamera(45, 1.6, 0.1, 500);
const P = { subway: [[7, 4, -12], [-0.5, 0.5, -3]], shelter: [[8, 3, 4], [-0.5, 1.2, 12]], all: [[12, 6, -24], [-1, 1, 0]], stairtop: [[2.5, 3.5, -1], [-0.4, 0, -6]] }[v];
cam.position.set(...P[0]); cam.lookAt(...P[1]); r.render(sc, cam);
</script></body></html>
