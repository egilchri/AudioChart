<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ted's Birdseye · AudioChart</title>
<!-- Ted's Birdseye, from AudioChart (v1070): an address of its own, so it installs as an app of its own (under
     /AudioChart/ an installed AudioChart claimed it). The view itself is AudioChart's Bird's-eye, the same page,
     code and data, shown full-window: /AudioChart/bay3d.html?app=birdseye, with this page's ?region= etc passed on.
     Source: AudioChart's design/birdseye/site/ (published to github.com/egilchri/birdseye). -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/birdseye-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icons/birdseye-180.png" sizes="180x180">
<meta name="apple-mobile-web-app-title" content="Ted's Birdseye">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#122a3a">
<style>
  html, body { margin: 0; height: 100%; background: #1e3a50; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  /* the opening screen (v1072, requested: "an opening screen, with a special logo"): Ted's Birdseye's own mark, AudioChart
     as the parent brand under it, and how the bay's loading; it fades once the bay is up (a tap skips it) */
  #open { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center; cursor: pointer;
    background: radial-gradient(ellipse at 50% 38%, #2c5878 0%, #173247 55%, #0d1f2c 100%); color: #e9eff1;
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif; transition: opacity 0.9s ease; padding: 24px; box-sizing: border-box; }
  #open.gone { opacity: 0; pointer-events: none; }
  #open .mark { width: min(200px, 42vw); aspect-ratio: 1; border-radius: 22%; box-shadow: 0 14px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
    animation: rise 1.1s cubic-bezier(.2,.7,.2,1) both; }
  #open h1 { margin: 26px 0 0; font-weight: 600; font-size: clamp(2rem, 7vw, 3.1rem); letter-spacing: 0.02em; animation: rise 1.1s 0.15s cubic-bezier(.2,.7,.2,1) both; }
  #open .from { margin-top: 10px; display: inline-flex; align-items: center; gap: 8px; font-family: system-ui, -apple-system, sans-serif; font-size: 0.95rem; color: #b9c7cc;
    animation: rise 1.1s 0.3s cubic-bezier(.2,.7,.2,1) both; }
  #open .from img { width: 26px; height: 26px; border-radius: 50%; }
  #open .tag { margin-top: 18px; font-style: italic; font-size: 1.05rem; color: #e0a843; animation: rise 1.1s 0.45s cubic-bezier(.2,.7,.2,1) both; }
  #open .load { margin-top: 30px; font-family: system-ui, -apple-system, sans-serif; font-size: 0.82rem; letter-spacing: 0.04em; color: #9db3c2; min-height: 1.2em; }
  #open .bar { margin: 10px auto 0; width: 160px; height: 2px; border-radius: 1px; background: rgba(255,255,255,0.12); overflow: hidden; }
  #open .bar i { display: block; width: 40%; height: 100%; background: #e0a843; animation: sweep 1.4s ease-in-out infinite; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { #open *, #open { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<iframe id="view" title="Ted's Birdseye" allow="fullscreen; geolocation; autoplay"></iframe>
<div id="open" role="status" aria-label="Ted's Birdseye, from AudioChart: loading" title="Tap to go straight in">
  <div>
    <img class="mark" src="./icons/birdseye-512.png" alt="">
    <h1>Ted's Birdseye</h1>
    <div class="from"><img id="aclogo" alt="">from AudioChart</div>
    <div class="tag">The bays from the air</div>
    <div class="load" id="openload">&nbsp;</div>
    <div class="bar"><i></i></div>
  </div>
</div>
<script>
  // the AudioChart site beside this one (…/birdseye/ → …/AudioChart/; ?ac= for a test server)
  const q = new URLSearchParams(location.search);
  const ac = q.get('ac') || new URL('../AudioChart/', location.href).href;
  q.delete('ac'); q.set('app', 'birdseye');
  const view = document.getElementById('view');
  view.src = new URL('bay3d.html?' + q, ac).href;
  document.getElementById('aclogo').src = new URL('icons/icon-192.png', ac).href;
  // the opening screen: the view's own loading line under the logo, and away once the bay is up (2.5 s at least, so
  // it's seen; 25 s at most) or at a tap
  const open = document.getElementById('open'), loadEl = document.getElementById('openload'), t0 = Date.now();
  const away = () => { if (open.classList.contains('gone')) return; open.classList.add('gone'); setTimeout(() => open.remove(), 1000); try { view.focus(); } catch (_) {} };
  open.addEventListener('click', away);
  const watch = setInterval(() => {
    let st = null; try { st = view.contentDocument?.getElementById('status'); } catch (_) {}
    if (st && !st.hidden && st.textContent.trim()) loadEl.textContent = st.textContent.trim();
    const up = st && st.hidden;
    if ((up && Date.now() - t0 > 2500) || Date.now() - t0 > 25000) { clearInterval(watch); away(); }
  }, 200);
  // its title (the bay's name) as this window's, and the keys (N, B, …) go to it
  view.addEventListener('load', () => {
    try { const sync = () => { document.title = view.contentDocument.title || document.title; }; sync(); new MutationObserver(sync).observe(view.contentDocument.querySelector('title'), { childList: true }); } catch (_) {}
    view.focus();
  });
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
</script>
</body>
</html>
