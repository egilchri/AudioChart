name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check all app JS
        run: |
          for f in www/js/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Unit tests (parser, query)
        run: |
          node test/test_parser.js
          node test/test_query.js

      # Integration/regression suites against real chart data — since the
      # 2026-09 router extraction (see the reliability-overhaul plan), these
      # call the REAL router (www/js/router.js) through the REAL query
      # engine, not a hand-maintained port that could drift from the shipped
      # code. Each script's own exit code already separates gating cases
      # (genuinely fixed, safety-relevant routes — a regression here SHOULD
      # fail CI) from cases explicitly marked EXPERIMENTAL/KNOWN-FAILING in
      # test_channel_routing.js's own comments (known, understood, currently-
      # accepted gaps — e.g. case [10]'s bundled-default-vs-region-data
      # staleness, or case [14]'s genuine unfixed router timeout) — those are
      # still run and logged on every PR, just not gating. No longer
      # continue-on-error: a real regression in a gated case should block.
      - name: Regression suites
        run: |
          node test/test_channel_routing.js
          node test/test_route_hazard_clearance.js
